# ─────────────────────────────────────────────────────────────────────────────
#  CI — runs on every push / pull request to main (and manually from the
#  Actions tab). A red ❌ on a commit means something below broke.
#
#  api    : builds the .NET API and runs tests/DailyTrackerAPI.Tests twice —
#           on SQLite (quick) and on a real PostgreSQL built by the migrations
#           (the same database engine as the hosted site on Neon).
#  docker : builds the hosting image (Dockerfile) so a broken build is caught
#           here — Render only deploys commits whose checks are all green.
#  ui  : installs exact package versions, strict TypeScript check, production build,
#        then browser tests of the chat (ui/e2e, Playwright) against a fake backend.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/DailyTrackerAPI.Tests/DailyTrackerAPI.Tests.csproj

      - name: Build (API + tests)
        run: dotnet build tests/DailyTrackerAPI.Tests/DailyTrackerAPI.Tests.csproj --no-restore -c Release

      - name: Test
        run: >
          dotnet test tests/DailyTrackerAPI.Tests/DailyTrackerAPI.Tests.csproj
          --no-build -c Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Test on PostgreSQL (real migrations)
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password
        run: >
          dotnet test tests/DailyTrackerAPI.Tests/DailyTrackerAPI.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=test-results-postgres.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: TestResults
          retention-days: 14

  ui:
    name: UI · type-check, build & chat tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Type-check (strict)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

      # Ubuntu's package mirror sometimes stalls with no output; give up on a stalled
      # download fast and try again instead of hanging until the job is cancelled.
      - name: Install browser for chat tests
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          npx playwright install chromium
          for attempt in 1 2; do
            timeout 240 npx playwright install-deps chromium && exit 0
            echo "::warning::Installing browser system packages stalled or failed (attempt $attempt of 2)"
            sleep 10
          done
          exit 1

      - name: Chat tests (real browser, fake backend)
        run: npx playwright test

      - name: Upload chat test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chat-test-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14

  docker:
    name: Hosting image · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the Docker image (not published)
        run: docker build --tag dailytracker:ci .
